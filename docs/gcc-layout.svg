<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="600" viewBox="0 0 1120 600" role="img" aria-labelledby="title description">
  <title id="title">Каталоги GCC и символические ссылки</title>
  <desc id="description">В каталоге /opt/gcc настоящая установка находится в 16.2.0. Ссылка 16 ведёт на 16.2.0, ссылка current ведёт на 16. Один компилятор доступен по трём путям.</desc>
  <rect width="1120" height="600" rx="20" fill="#f4f7fc"/>
  <g font-family="DejaVu Sans, sans-serif" fill="#1a2940">
    <text x="40" y="54" font-size="29" font-weight="bold">/opt/gcc: версии и ссылки</text>
    <text x="40" y="88" font-size="18">Пример для установленного GCC 16.2.0</text>
    <rect x="40" y="119" width="1040" height="168" rx="14" fill="#ffffff" stroke="#ccd6e5"/>
    <g font-family="DejaVu Sans Mono, monospace" font-size="23">
      <text x="65" y="157">/opt/gcc/</text>
      <text x="65" y="194">├── 16.2.0/</text>
      <text x="65" y="231">├── 16 -&gt; 16.2.0</text>
      <text x="65" y="268">└── current -&gt; 16</text>
    </g>
    <g font-size="18" fill="#455571">
      <text x="450" y="194">Компилятор, заголовки и библиотеки</text>
      <text x="450" y="231">Выбранный выпуск ветки GCC 16</text>
      <text x="450" y="268">Выбранная основная версия</text>
    </g>
    <rect x="40" y="321" width="230" height="86" rx="12" fill="#e6efff" stroke="#9fb8e3"/>
    <rect x="355" y="321" width="230" height="86" rx="12" fill="#e6efff" stroke="#9fb8e3"/>
    <rect x="670" y="321" width="410" height="86" rx="12" fill="#e0f2e7" stroke="#90bea0"/>
    <g text-anchor="middle">
      <text x="155" y="356" font-size="24" font-family="DejaVu Sans Mono, monospace">current</text>
      <text x="155" y="386" font-size="16">ссылка</text>
      <text x="470" y="356" font-size="24" font-family="DejaVu Sans Mono, monospace">16</text>
      <text x="470" y="386" font-size="16">ссылка</text>
      <text x="875" y="356" font-size="24" font-family="DejaVu Sans Mono, monospace">16.2.0/</text>
      <text x="875" y="386" font-size="16">настоящий каталог установки</text>
    </g>
    <g fill="none" stroke="#3564b3" stroke-width="3">
      <path d="M285 364H335M325 354L335 364L325 374"/>
      <path d="M600 364H650M640 354L650 364L640 374"/>
    </g>
    <text x="40" y="448" font-size="19" font-weight="bold">Три пути запуска одного компилятора:</text>
    <g font-family="DejaVu Sans Mono, monospace" font-size="20">
      <text x="65" y="483">/opt/gcc/16.2.0/bin/g++</text>
      <text x="65" y="518">/opt/gcc/16/bin/g++</text>
      <text x="65" y="553">/opt/gcc/current/bin/g++</text>
    </g>
    <g font-size="17" fill="#455571">
      <text x="520" y="483">конкретный выпуск</text>
      <text x="520" y="518">выбранный выпуск ветки 16</text>
      <text x="520" y="553">выбранная основная версия</text>
    </g>
  </g>
</svg>
